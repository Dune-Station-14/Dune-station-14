- type: entity
  parent: CombatKnife
  id: BaseDuneCombatKnife
  abstract: true
  components:
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 1.5
    damage:
      types:
        Slash: 25
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 35

- type: entity
  parent: BaseSword
  id: BaseDuneCombatSword
  abstract: true
  components:
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 1.5
    damage:
      types:
        Slash: 35

# Fremen Knife
- type: entity
  name: worm tooth knife
  parent: BaseDuneCombatKnife
  id: WormToothKnife
  description: A sacred fremen knife made from the tooth of a sandworm.
  components:
  - type: Sprite
    sprite: _Dune/Weapons/Crysknife.rsi
    state: icon
  - type: Item
    sprite: _Dune/Weapons/Crysknife.rsi
    storedSprite:
      state: storage
      sprite: _Dune/Weapons/Crysknife.rsi

# Atreides Knife
- type: entity
  name: Atreides short sword
  parent: BaseDuneCombatKnife
  id: AtreidesShortsword
  description: Standard shortsword used by foot soldiers of House Atreides
  components:
  - type: Sprite
    sprite: _Dune/Weapons/AtreidesShortSword.rsi
    state: icon
  - type: Item
    sprite: _Dune/Weapons/AtreidesShortSword.rsi
    storedSprite:
      state: storage
      sprite: _Dune/Weapons/AtreidesShortSword.rsi

# Harkonnen Knife (Needs sprite, just using Kukri rn)
- type: entity
  name: Harkonnen dagger
  parent: BaseDuneCombatKnife
  id: HarkonnenDagger
  description: Standard dagger used by members of house Harkonnen
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/kukri_knife.rsi
    state: icon
  - type: Item
    sprite: Objects/Weapons/Melee/kukri_knife.rsi
    storedSprite: null
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 1.5
    damage:
      types:
        Slash: 20 # less because can hold poison, harkonnen should be more cheaty
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 30
  # Poison blade stuff
  - type: SolutionContainerManager
    solutions:
      melee:
        maxVol: 5
  - type: MeleeChemicalInjector
    solution: melee
  - type: RefillableSolution
    solution: melee
  - type: InjectableSolution
    solution: melee
  - type: SolutionInjectOnEmbed
    transferAmount: 2 # slow inject so you can't just be poisoned instantly
    solution: melee
  - type: SolutionInjectWhileEmbedded
    transferAmount: 1
    solution: melee
    updateInterval: 2
  - type: SolutionTransfer
    maxTransferAmount: 5

